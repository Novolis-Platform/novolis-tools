name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/version.json'
      - 'build/version.props'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      skip_publish:
        type: boolean
        default: false
jobs:
  ci:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-merge-publish.yml@main
    secrets: inherit
    with:
      skip_publish: ${{ inputs.skip_publish == true }}
    permissions:
      contents: read
      packages: write

  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      skip_build: ${{ steps.matrix.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - name: Resolve changed-tool matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dotnet run --project tools/ToolsManifest/ToolsManifest.csproj --no-launch-profile -- \
              ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              dotnet run --project tools/ToolsManifest/ToolsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
            else
              git diff --name-only "$before...${{ github.sha }}" > /tmp/changed-files.txt || true
              dotnet run --project tools/ToolsManifest/ToolsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --changed-files /tmp/changed-files.txt \
                > /tmp/matrix.json
            fi
          fi
          echo "matrix=$(jq -c '.include' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "skip_build=$(jq -r '.skip_build' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  changed-tools:
    needs: detect
    if: needs.detect.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}
      - name: Restore and build changed tool
        run: |
          set -euo pipefail
          dotnet restore "${{ matrix.project }}"
          dotnet build "${{ matrix.project }}" --no-restore -c Release
      - name: Test changed tool scope
        env:
          TESTS_JSON: ${{ toJson(matrix.tests) }}
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            [ -n "$test" ] || continue
            dotnet test "$test" --no-build -c Release
          done < <(jq -r '.[]' <<< "$TESTS_JSON")
