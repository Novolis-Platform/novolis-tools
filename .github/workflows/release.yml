name: Release
on:
  release:
    types: [published]
jobs:
  ci:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-release-publish.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  nuget:
    needs: ci
    if: needs.ci.outputs.packed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: frankhaugen
      - uses: Novolis-Platform/novolis-workflows/actions/publish-nuget-org@main
        with:
          api_key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
